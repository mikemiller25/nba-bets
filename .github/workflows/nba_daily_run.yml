name: Run Daily NBA Analytics

on:
  schedule:
    # Runs daily at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-nba-script:
    runs-on: ubuntu-latest
    
    # 1. Add write permissions so it can push data.json back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NBA analytics script
        run: |
          python nba_tool.py

      # 2. Add this step to automatically save and push data.json to GitHub Pages
      - name: Commit and push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update daily NBA betting metrics [skip ci]" || exit 0
          git push
