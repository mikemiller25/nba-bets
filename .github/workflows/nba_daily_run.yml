name: Update NBA Data

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour (or whatever schedule you set)
  workflow_dispatch: # Allows you to click "Run workflow" manually

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    # CRITICAL: This gives GitHub Actions permission to push changes back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run NBA scraper script
        run: python nba_tool.py

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update NBA data.json via GitHub Actions"
          file_pattern: data.json
